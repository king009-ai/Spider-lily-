<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakshabandhan 🌻</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial, sans-serif;
  background:#FFF7ED;
  color:#432c1a;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  background:#FFF7ED;
}

.container{
  width:100%;
  max-width:430px;
  height:100%;
  position:relative;
  overflow:hidden;
  background:#FFF7ED;
  box-shadow:0 0 30px rgba(0,0,0,.12);
}

.page{
  width:100%;
  height:100%;
  overflow-y:auto;
  scrollbar-width:none;
}

.page::-webkit-scrollbar{
  display:none;
}

.screen{
  min-height:100%;
  padding:40px 24px 90px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  animation:fade .6s ease;
}

.center{
  text-align:center;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* INTRO */

.intro-screen{
  padding:25px 18px 80px;
}

.intro-sparkles{
  font-size:20px;
  margin-bottom:5px;
  opacity:.75;
  animation:float 3s ease-in-out infinite;
}

.intro-flower{
  font-size:58px;
  margin-bottom:-4px;
  animation:bounce 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.intro-title{
  font-family:Georgia,serif;
  font-size:clamp(45px,12vw,68px);
  font-weight:500;
  line-height:1.05;
  margin:0;
  color:#432c1a;
}

.intro-by{
  font-family:Georgia,serif;
  font-style:italic;
  font-size:19px;
  color:#6b7280;
  margin:10px 0;
}

.wave{
  color:#E36C39;
  font-size:24px;
  letter-spacing:-7px;
  margin:5px 0 15px;
}

.facts{
  width:100%;
  background:#FEF3C7;
  border:2px solid #432c1a;
  border-radius:22px;
  padding:18px 20px;
  margin:5px 0 20px;
  text-align:left;
  box-shadow:5px 5px 0 #432c1a;
}

.facts h3{
  text-align:center;
  margin:0 0 14px;
  font-family:Georgia,serif;
  font-size:21px;
}

.facts p{
  font-size:14px;
  line-height:1.5;
  margin:9px 0;
}

/* TEXT */

h1,h2,h3{
  font-family:Georgia,serif;
}

h2{
  font-size:38px;
  margin:12px 0;
}

.hero{
  font-family:Georgia,serif;
  font-size:clamp(42px,11vw,62px);
  line-height:1.05;
  letter-spacing:3px;
  margin:0;
  color:#2f3e46;
}

.eyebrow{
  color:#6b7280;
  letter-spacing:5px;
  font-size:12px;
}

.body-text{
  max-width:330px;
  color:#6b7280;
  line-height:1.6;
  font-size:14px;
}

.small{
  font-size:12px;
  color:#6b7280;
}

/* BUTTONS */

.btn{
  border:2px solid #432c1a;
  padding:13px 24px;
  border-radius:999px;
  font-weight:bold;
  font-size:15px;
  box-shadow:0 4px 0 rgba(0,0,0,.2);
  transition:.1s;
  margin:8px;
}

.btn:active{
  transform:translateY(4px);
  box-shadow:0 0 0 rgba(0,0,0,.2);
}

.primary{
  background:#E36C39;
  color:white;
}

.secondary{
  background:#2A6F75;
  color:white;
}

/* MUSIC */

.music-card{
  width:290px;
  background:#E2E8F0;
  border:2px solid #1f2937;
  padding:10px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:12px;
  margin:40px 0 25px;
  box-shadow:4px 4px 0 rgba(0,0,0,.1);
}

.play{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#1f2937;
  color:white;
  font-size:21px;
  flex-shrink:0;
}

.music-info{
  flex:1;
  overflow:hidden;
  text-align:left;
}

.music-info strong,
.music-info span{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.music-info strong{
  font-size:13px;
}

.music-info span{
  font-size:11px;
  color:#4b5563;
}

.bars{
  display:flex;
  gap:3px;
  align-items:center;
}

.bars i{
  width:3px;
  height:10px;
  background:#1f2937;
  border-radius:3px;
}

.playing .bars i{
  animation:pulse .7s infinite alternate;
}

.playing .bars i:nth-child(2){
  animation-delay:.15s;
}

.playing .bars i:nth-child(3){
  animation-delay:.3s;
}

.playing .bars i:nth-child(4){
  animation-delay:.45s;
}

@keyframes pulse{
  from{height:5px}
  to{height:17px}
}

/* RICK ROLL BUTTON */

.rickroll-btn{
  width:290px;
  background:#FDE68A;
  border:2px dashed #432c1a;
  padding:10px 14px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 20px;
  box-shadow:4px 4px 0 rgba(0,0,0,.1);
  text-align:left;
}

.rickroll-btn:active{
  transform:translateY(2px);
  box-shadow:2px 2px 0 rgba(0,0,0,.1);
}

.rickroll-icon{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#432c1a;
  color:#FDE68A;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.rickroll-info{
  flex:1;
  overflow:hidden;
}

.rickroll-info strong,
.rickroll-info span{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rickroll-info strong{
  font-size:13px;
}

.rickroll-info span{
  font-size:11px;
  color:#6b7280;
}

/* CARDS */

.pill{
  padding:9px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}

.dark{
  background:#432c1a;
  color:white;
}

.polaroid{
  width:260px;
  background:white;
  padding:8px;
  border:2px solid #432c1a;
  border-radius:17px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
  margin:20px 0;
  position:relative;
}

.rotate-right{
  transform:rotate(2deg);
}

.rotate-left{
  transform:rotate(-2deg);
}

.illustration{
  width:100%;
  display:block;
}

.polaroid span{
  position:absolute;
  bottom:-17px;
  right:-14px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#FCD34D;
  display:flex;
  justify-content:center;
  align-items:center;
  border:2px solid #432c1a;
}

.serif-bold{
  font-family:Georgia,serif;
  font-weight:bold;
  font-size:18px;
}

/* QUIZ */

.game{
  border:1px solid #6b7280;
  border-radius:999px;
  padding:6px 16px;
  font-size:11px;
  letter-spacing:2px;
  font-weight:bold;
  color:#6b7280;
}

.dots{
  display:flex;
  gap:6px;
  margin:15px 0;
}

.dots i{
  display:block;
  width:12px;
  height:4px;
  border-radius:5px;
  background:#d1d5db;
}

.dots .active{
  width:25px;
  background:#E36C39;
}

.quiz{
  width:100%;
  background:#FEF3C7;
  border:2px solid #432c1a;
  border-radius:22px;
  padding:25px 20px;
  box-shadow:6px 6px 0 #432c1a;
}

.quiz h3{
  font-size:21px;
  margin:0 0 20px;
}

.answer{
  width:100%;
  padding:13px;
  margin:7px 0;
  background:#FED7AA;
  border:2px solid #432c1a;
  border-radius:13px;
  font-weight:bold;
  color:#432c1a;
}

.answer:nth-child(3){
  background:#FDE68A;
}

.answer:active{
  transform:scale(.97);
}

/* GIFT */

.gift{
  font-size:80px;
  animation:bounce 1.4s infinite;
}

.gift-text{
  background:#432c1a;
  color:white;
  padding:10px 22px;
  border-radius:999px;
  font-weight:bold;
}

/* MEME */

.meme{
  width:100%;
  background:white;
  padding:12px;
  border:2px solid #432c1a;
  border-radius:25px;
  box-shadow:8px 8px 0 #432c1a;
  margin-bottom:25px;
}

.meme svg{
  width:100%;
  display:block;
  border-radius:12px;
}

.replay{
  width:100%;
  max-width:330px;
}

/* CONFETTI */

.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:20;
}

.confetti span{
  position:absolute;
  top:-20px;
  width:8px;
  height:13px;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

/* MUTE */

.mute{
  position:absolute;
  top:15px;
  right:15px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:white;
  border:2px solid #432c1a;
  z-index:50;
}

/* FOOTER */

.flowers{
  position:absolute;
  bottom:5px;
  left:0;
  width:100%;
  text-align:center;
  font-size:25px;
  pointer-events:none;
}
</style>
</head>

<div class="app">
<div class="container">

<div id="page" class="page"></div>

<div class="flowers">
🌸　🌼　🌺　🌻　🌸
</div>

</div>
</div>

/* =========================
   STATE
========================= */

let step=0;
let playing=false;
let muted=false;

const page=document.getElementById("page");
const audio=document.getElementById("audio");

audio.src=config.music;


/* =========================
   HELPERS
========================= */

function next(){

  step++;

  render();

  /*
    Start music when entering
    the original music page.
  */

  if(step===1 && !playing){
    startMusic();
  }
}


function startMusic(){

  if(!config.music){
    return;
  }

  audio.play()
  .then(()=>{
    playing=true;
    render();
  })
  .catch(()=>{
    playing=false;
    render();
  });

}


function toggleMusic(){

  if(playing){

    audio.pause();
    playing=false;

  }else{

    startMusic();

  }

  render();
}


function mute(){

  muted=!muted;

  audio.muted=muted;

  render();

}


function openRickroll(){

  window.open(config.rickrollUrl,"_blank","noopener,noreferrer");

}


function replay(){

  /*
    Completely reset the experience.
  */

  audio.pause();

  audio.currentTime=0;

  playing=false;

  muted=false;

  audio.muted=false;

  step=0;

  render();

}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   CONFETTI
========================= */

function confetti(){

  let colors=[
    "#E36C39",
    "#2A6F75",
    "#FCD34D",
    "#F472B6"
  ];

  let html='<div class="confetti">';

  for(let i=0;i<35;i++){

    let left=Math.random()*100;
    let delay=Math.random()*2;
    let duration=2.5+Math.random()*3;
    let color=colors[Math.floor(Math.random()*colors.length)];

    html+=`
      <span
        style="
          left:${left}%;
          background:${color};
          animation-delay:${delay}s;
          animation-duration:${duration}s;
        ">
      </span>
    `;

  }

  html+="</div>";

  return html;

}
